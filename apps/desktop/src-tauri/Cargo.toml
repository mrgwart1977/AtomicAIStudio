[package]
name = "atomic-dream-engine"
version = "0.1.0"
description = "Atomic Dream Engine — Windows desktop AI filmmaking application"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.0.0-rc.8"
tauri-plugin-opener = "=2.7.2"

[profile.release]
opt-level = 3
lto = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
