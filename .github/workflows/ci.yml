name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. force-push to a PR branch).
# Main pushes share refs/heads/main, so a newer merge supersedes an older
# in-flight main run -- desirable, the old commit is stale anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Computes which path groups changed. Fails OPEN: if detection errors,
  # every output defaults to true so a broken diff can never silently
  # skip a required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      tauri: ${{ steps.diff.outputs.tauri }}
      package: ${{ steps.diff.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          git diff --name-only "$BASE"...HEAD > files.txt 2>/dev/null
          if [ ! -s files.txt ]; then git show --name-only --format= HEAD > files.txt 2>/dev/null; fi
          out() { if grep -qE "$2" files.txt || [ ! -s files.txt ]; then echo "$1=true"; else echo "$1=false"; fi; }
          out backend '^(backend/|scripts/fetch-ffmpeg\.ps1|\.github/workflows/ci\.yml)' >> "$GITHUB_OUTPUT"
          out frontend '^apps/desktop/' >> "$GITHUB_OUTPUT"
          out tauri '^apps/desktop/' >> "$GITHUB_OUTPUT"
          out package '^(backend/(atomic-backend\.spec|sidecar_entry\.py|pyproject\.toml|ffmpeg-manifest\.json)|scripts/(build-sidecar|fetch-ffmpeg)\.ps1|apps/desktop/src-tauri/|\.github/workflows/ci\.yml)' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: FFmpeg binary cache
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ffmpeg-${{ hashFiles('backend/ffmpeg-manifest.json') }}
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Fetch approved FFmpeg (sha256-verified, see backend/ffmpeg-manifest.json)
        shell: pwsh
        run: scripts/fetch-ffmpeg.ps1
      - name: Tests
        working-directory: backend
        run: python -m pytest tests -q

  # Platform-independent: tsc + vite produce identical output on Linux,
  # and ubuntu minutes bill at 1x vs Windows 2x.
  frontend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install + build UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

  tauri-check:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.tauri == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install UI deps (dist needed by tauri config)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Stub sidecar resource dir (real binary only needed at bundle time)
        shell: pwsh
        run: New-Item -ItemType Directory -Force apps/desktop/src-tauri/backend-dist/atomic-backend | Out-Null
      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-target-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Build Tauri shell (no bundle)
        working-directory: apps/desktop/src-tauri
        run: cargo build --verbose

  # Packaging runs on every main push and manual dispatch (release
  # validation), plus PRs that touch packaging-sensitive paths. Ordinary
  # PRs skip it -- post-merge main runs still catch freeze/bundle issues.
  package:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.package == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: FFmpeg binary cache
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ffmpeg-${{ hashFiles('backend/ffmpeg-manifest.json') }}
      - name: Fetch approved FFmpeg (sha256-verified, see backend/ffmpeg-manifest.json)
        shell: pwsh
        run: scripts/fetch-ffmpeg.ps1
      - name: Build frozen backend sidecar
        working-directory: backend
        run: |
          pip install -e . pyinstaller
          pyinstaller atomic-backend.spec --noconfirm
      - name: Verify FFmpeg staged in frozen build (fail closed)
        shell: pwsh
        run: |
          $ff = "backend/dist/atomic-backend/_internal/ffmpeg/bin"
          if (-not ((Test-Path "$ff/ffmpeg.exe") -and (Test-Path "$ff/ffprobe.exe"))) {
            throw "frozen build missing bundled ffmpeg/ffprobe"
          }
      - name: Stage sidecar into Tauri bundle dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/backend-dist | Out-Null
          Copy-Item -Recurse backend/dist/atomic-backend apps/desktop/src-tauri/backend-dist/atomic-backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-target-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Build installer (bundles frozen sidecar)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: atomic-dream-engine-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
