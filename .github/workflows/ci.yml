name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read repo contents. No secrets are used.
permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Fetch approved FFmpeg (sha256-verified, see backend/ffmpeg-manifest.json)
        shell: pwsh
        run: scripts/fetch-ffmpeg.ps1
      - name: Tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install + build UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

  tauri-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install UI deps (dist needed by tauri config)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Stub sidecar resource dir (real binary only needed at bundle time)
        shell: pwsh
        run: New-Item -ItemType Directory -Force apps/desktop/src-tauri/backend-dist/atomic-backend | Out-Null
      - name: Rust cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/desktop/src-tauri/target
          key: tauri-target-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Build Tauri shell (no bundle)
        working-directory: apps/desktop/src-tauri
        run: cargo build --verbose

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch approved FFmpeg (sha256-verified, see backend/ffmpeg-manifest.json)
        shell: pwsh
        run: scripts/fetch-ffmpeg.ps1
      - name: Build frozen backend sidecar
        working-directory: backend
        run: |
          pip install -e . pyinstaller
          pyinstaller atomic-backend.spec --noconfirm
      - name: Verify FFmpeg staged in frozen build (fail closed)
        shell: pwsh
        run: |
          $ff = "backend/dist/atomic-backend/_internal/ffmpeg/bin"
          if (-not ((Test-Path "$ff/ffmpeg.exe") -and (Test-Path "$ff/ffprobe.exe"))) {
            throw "frozen build missing bundled ffmpeg/ffprobe"
          }
      - name: Stage sidecar into Tauri bundle dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/backend-dist | Out-Null
          Copy-Item -Recurse backend/dist/atomic-backend apps/desktop/src-tauri/backend-dist/atomic-backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Rust cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/desktop/src-tauri/target
          key: tauri-target-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Build installer (bundles frozen sidecar)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build
      - name: Upload NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atomic-dream-engine-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
