[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-ai-studio-backend"
version = "0.1.0"
description = "Atomic AI Studio local backend service (FastAPI sidecar for the Tauri desktop shell)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psutil>=6.0",
    "pillow>=10.3",
    # Optional-but-bundled: PyAV provides video validation/metadata when no
    # ffprobe binary is installed (BSD-licensed; wheels bundle LGPL ffmpeg).
    "av>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
