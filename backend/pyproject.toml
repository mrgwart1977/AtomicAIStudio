[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-dream-engine-backend"
version = "0.1.0"
description = "Atomic Dream Engine local backend service (FastAPI sidecar for the Tauri desktop shell)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psutil>=6.0",
    "pillow>=10.3",
    # Dev-only probe backend: PyAV is BSD-3, but its wheels bundle FFmpeg
    # built with libx264/libx265 (GPL-2.0+) — permanently EXCLUDED from the
    # frozen installer (atomic-backend.spec). Production media validation
    # uses the approved BtbN LGPL ffmpeg/ffprobe binaries (see
    # ffmpeg-manifest.json); PyAV is only a dev-environment fallback.
    "av>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "network: opt-in tests that perform real network requests (run only via ATOMIC_TEST_NETWORK=1)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
