<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#101722"/><g font-family="Arial" fill="#eef3fb"><text x="50" y="65" font-size="30" font-weight="bold">One studio — choose your level of control</text><text x="50" y="108" font-size="19">Guided by default. Prompts always available. Technical tools optional.</text><rect x="50" y="150" width="1100" height="120" rx="16" fill="#263b52" stroke="#7ca8d8"/><text x="80" y="193" font-size="26" font-weight="bold">Guided Studio</text><text x="80" y="235" font-size="19">Describe your idea → review a storyboard → create takes → edit → export</text><rect x="50" y="300" width="1100" height="120" rx="16" fill="#263b52" stroke="#7ca8d8"/><text x="80" y="343" font-size="26" font-weight="bold">Standard Workspace</text><text x="80" y="385" font-size="19">Characters, world memory, prompts, performance and timeline controls</text><rect x="50" y="450" width="1100" height="120" rx="16" fill="#263b52" stroke="#7ca8d8"/><text x="80" y="493" font-size="26" font-weight="bold">Advanced Workspace</text><text x="80" y="535" font-size="19">Typed node graphs, model parameters and inspectable conditioning</text><rect x="50" y="600" width="1100" height="120" rx="16" fill="#263b52" stroke="#7ca8d8"/><text x="80" y="643" font-size="26" font-weight="bold">Shared Production Engine</text><text x="80" y="685" font-size="19">Versioned workflows, scoped memory, budgets, approvals and manifests</text></g></svg>