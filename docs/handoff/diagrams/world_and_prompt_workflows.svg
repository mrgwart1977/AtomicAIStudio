<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#9bb2cf"/></marker></defs><rect width="1400" height="900" fill="#101722"/><g font-family="Arial" fill="#eef3fb"><text x="60" y="65" font-size="32" font-weight="bold">Create with a cinematic world, direct prompts, or both</text><text x="60" y="108" font-size="20">Atomic Dream Engine v0.5 — one project-scoped production engine</text><rect x="60" y="160" width="600" height="145" rx="16" fill="#263b52" stroke="#7ca8d8"/><text x="85" y="204" font-size="26" font-weight="bold">World-based production</text><text x="85" y="245" font-size="20">Versioned characters, locations, cameras, performances</text><rect x="740" y="160" width="600" height="145" rx="16" fill="#263b52" stroke="#7ca8d8"/><text x="765" y="204" font-size="26" font-weight="bold">Direct Prompt Workbench</text><text x="765" y="245" font-size="20">User text, dialogue, references and model settings</text><rect x="300" y="380" width="800" height="135" rx="16" fill="#263b52" stroke="#7ca8d8"/><text x="325" y="424" font-size="26" font-weight="bold">Hybrid review and request compilation</text><text x="325" y="465" font-size="20">Inspect prompts, overrides, conditioning and conflicts</text><rect x="300" y="580" width="800" height="115" rx="16" fill="#263b52" stroke="#7ca8d8"/><text x="325" y="624" font-size="26" font-weight="bold">Generate a new take</text><text x="325" y="665" font-size="20">Image / video / voice / repair • budgets and capability checks</text><rect x="300" y="755" width="800" height="100" rx="16" fill="#263b52" stroke="#7ca8d8"/><text x="325" y="799" font-size="26" font-weight="bold">Review, edit and approve</text><text x="325" y="840" font-size="20">Seal an immutable manifest; retain original assets</text><g stroke="#9bb2cf" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M360 305 V340 H530 V380"/><path d="M1040 305 V340 H870 V380"/><path d="M700 515 V580"/><path d="M700 695 V755"/></g><text x="65" y="550" font-size="18">Default scope: this take only. Broader world changes require an explicit reviewed revision.</text></g></svg>