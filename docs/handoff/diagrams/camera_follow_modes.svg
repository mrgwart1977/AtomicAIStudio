<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1130" viewBox="0 0 1400 1130"><rect width="1400" height="1130" fill="#101722"/><g font-family="Arial" fill="#eef3fb"><text x="55" y="65" font-size="32" font-weight="bold">Camera Follow / Tracking Shots</text><text x="55" y="110" font-size="21">Select a subject → choose a follow mode → adjust → preview → create a take</text><rect x="55" y="150" width="630" height="135" rx="15" fill="#263b52" stroke="#7ca8d8"/><text x="77" y="193" font-size="25" font-weight="bold">1. Follow Behind</text><text x="77" y="235" font-size="19">Trailing distance and turn response</text><rect x="715" y="150" width="630" height="135" rx="15" fill="#263b52" stroke="#7ca8d8"/><text x="737" y="193" font-size="25" font-weight="bold">2. Follow Front</text><text x="737" y="235" font-size="19">Lead distance and backward clearance</text><rect x="55" y="310" width="630" height="135" rx="15" fill="#263b52" stroke="#7ca8d8"/><text x="77" y="353" font-size="25" font-weight="bold">3. Follow Side</text><text x="77" y="395" font-size="19">Left/right and lateral distance</text><rect x="715" y="310" width="630" height="135" rx="15" fill="#263b52" stroke="#7ca8d8"/><text x="737" y="353" font-size="25" font-weight="bold">4. Over Shoulder</text><text x="737" y="395" font-size="19">Shoulder side and separate look-at target</text><rect x="55" y="470" width="630" height="135" rx="15" fill="#263b52" stroke="#7ca8d8"/><text x="77" y="513" font-size="25" font-weight="bold">5. Orbit Follow</text><text x="77" y="555" font-size="19">Radius, direction and moving center</text><rect x="715" y="470" width="630" height="135" rx="15" fill="#263b52" stroke="#7ca8d8"/><text x="737" y="513" font-size="25" font-weight="bold">6. Drone Follow</text><text x="737" y="555" font-size="19">Altitude, tilt and terrain clearance</text><rect x="55" y="630" width="630" height="135" rx="15" fill="#263b52" stroke="#7ca8d8"/><text x="77" y="673" font-size="25" font-weight="bold">7. Vehicle Chase</text><text x="77" y="715" font-size="19">Chase offset and speed response</text><rect x="715" y="630" width="630" height="135" rx="15" fill="#263b52" stroke="#7ca8d8"/><text x="737" y="673" font-size="25" font-weight="bold">8. Lead and Follow</text><text x="737" y="715" font-size="19">Timed relationship and route transition</text><rect x="55" y="790" width="630" height="135" rx="15" fill="#263b52" stroke="#7ca8d8"/><text x="77" y="833" font-size="25" font-weight="bold">9. Group Tracking</text><text x="77" y="875" font-size="19">Members, weights, padding and limits</text><rect x="715" y="790" width="630" height="135" rx="15" fill="#263b52" stroke="#7ca8d8"/><text x="737" y="833" font-size="25" font-weight="bold">10. Target Switching</text><text x="737" y="875" font-size="19">Targets, blend timing and focus transition</text><text x="55" y="1000" font-size="20">Always editable: target, distance, height, framing, smoothness, timing and prompt.</text><text x="55" y="1040" font-size="19">Advanced: lock, lag, prediction, focus, collision policy, splines and keyframed transitions.</text><text x="55" y="1080" font-size="18">Scene preview accuracy and AI-generated camera adherence are reported separately.</text></g></svg>