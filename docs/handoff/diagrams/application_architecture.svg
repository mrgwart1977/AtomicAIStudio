<rect x="70" y="695" width="1360" height="150" class="accent"/>
<text x="750" y="738" text-anchor="middle" class="h">Local Storage + Optional Authorized Cloud Providers</text>
<text x="750" y="777" text-anchor="middle" class="p">Projects / Assets / Character references / LoRA versions / Generated media / Cache / Backups</text>
<text x="750" y="810" text-anchor="middle" class="p">Local models: image, video, audio, training • Cloud: approved APIs with explicit cost and consent controls</text>
